[project]
name = "ds-slv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Leonid-SV", email = "leo.sevastyanov@gmail.com" }
]
requires-python = "==3.14.2"
dependencies = [
    "black>=26.10.1",
    "ipykernel>=7.4.0",
    "isort>=9.0.2",
    "loguru>=0.8.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pre-commit>=4.7.0",
    "pyarrow>=26.0.1",
    "pylint>=4.1.4",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
ds-slv = "ds_slv:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
